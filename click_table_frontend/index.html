<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Source Sans Pro", "Segoe UI", sans-serif;
         color: #1E293B; }
  [data-key] { cursor: pointer; user-select: none; }
  [data-key]:hover { background: #EDE9FE !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function send(type, data) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  function setHeight() {
    send("streamlit:setFrameHeight",
         { height: document.body.scrollHeight + 12 });
  }
  function render(args) {
    var root = document.getElementById("root");
    root.innerHTML = args.html || "";
    var multi = !!args.multi;
    var selected = args.selected || (multi ? [] : null);
    root.querySelectorAll("[data-key]").forEach(function (el) {
      var k = el.getAttribute("data-key");
      var isSel = multi ? selected.indexOf(k) >= 0 : k === selected;
      if (isSel) {
        if (el.hasAttribute("data-on")) {
          // page CSS owns the styling: swap the glyph, tag the row
          el.textContent = el.getAttribute("data-on");
        } else {
          el.textContent = "☑";
          el.style.background = "#7C3AED";
          el.style.color = "#FFFFFF";
        }
        el.classList.add("ct-sel");
        var tr = el.closest("tr");
        if (tr) tr.classList.add("ct-on");
      }
      el.addEventListener("click", function () {
        var v;
        if (multi) {
          v = selected.slice();
          var ix = v.indexOf(k);
          if (ix >= 0) v.splice(ix, 1); else v.push(k);
        } else {
          v = (k === selected) ? null : k;
        }
        send("streamlit:setComponentValue", { value: v, dataType: "json" });
      });
    });
    // let layout settle (fonts) before measuring
    setHeight();
    setTimeout(setHeight, 150);
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (m && m.type === "streamlit:render") render(m.args);
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
</script>
</body>
</html>
